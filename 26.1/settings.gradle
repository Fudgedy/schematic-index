pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		gradlePluginPortal()
	}
}

// Lets Gradle auto-provision a JDK 25 toolchain (required by Minecraft 26.2) when the host
// machine doesn't already have one installed.
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'schematicindex'
